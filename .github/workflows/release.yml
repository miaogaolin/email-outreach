name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const m=require('./manifest.json');const t=process.env.TAG.replace(/^v/,'');if(m.version!==t){console.error('manifest version '+m.version+' does not match tag '+t+'；请先提交版本号，再打 tag');process.exit(1)}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke load bundle
        run: node scripts/smoke-load.cjs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          generate_release_notes: true
